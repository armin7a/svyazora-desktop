<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Svyazora – keine Verbindung</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafafa; --fg: #18181b; --muted: #71717a; --line: #e7e7ea; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0c; --fg: #f4f4f5; --muted: #a1a1aa; --line: #26262a; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 320px; padding: 24px; text-align: center; }
      h1 { margin: 20px 0 6px; font-size: 18px; font-weight: 600; }
      p { margin: 0; color: var(--muted); }
      button { margin-top: 24px; height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: #6366f1; color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
      button:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" width="48" height="48" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#6366f1" />
        <path d="M42 22a10 10 0 1 0-10 10a10 10 0 1 1-10 10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" />
        <circle cx="42" cy="22" r="4.5" fill="#6366f1" stroke="#fff" stroke-width="3" />
        <circle cx="22" cy="42" r="4.5" fill="#6366f1" stroke="#fff" stroke-width="3" />
      </svg>
      <h1>Keine Verbindung</h1>
      <p>Svyazora braucht eine Internetverbindung. Sobald du wieder online bist, geht es automatisch weiter.</p>
      <button type="button" id="retry">Erneut versuchen</button>
    </main>
    <script>
      const target = new URLSearchParams(location.search).get('url')
      const retry = () => target && location.replace(target)
      document.getElementById('retry').addEventListener('click', retry)
      window.addEventListener('online', retry)
    </script>
  </body>
</html>
